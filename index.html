<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#F2E4CC" />
  <title>수상한 산책클럽 — 프로그램 선택</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="launcher-body">
  <main class="launcher">
    <header class="launcher-header">
      <img class="title-img" src="icons/타이틀.png" alt="수상한 산책클럽" />
      <p class="launcher-lead">오늘의 프로그램을 선택해 주세요</p>
    </header>

    <div class="program-cards">
      <a class="program-card" href="camera/">
        <div class="program-card-icon">
          <img src="icons/표지판.png" alt="" />
        </div>
        <div class="program-card-body">
          <div class="program-card-num">프로그램 ①</div>
          <div class="program-card-name">도형 카메라</div>
          <div class="program-card-desc">세모, 네모, 동그라미로<br/>골목의 풍경을 담는다</div>
        </div>
        <div class="program-card-arrow">→</div>
      </a>

      <a class="program-card" href="character.html">
        <div class="program-card-icon">
          <img src="icons/고양이1.png" alt="" />
        </div>
        <div class="program-card-body">
          <div class="program-card-num">프로그램 ②</div>
          <div class="program-card-name">캐릭터 메이커</div>
          <div class="program-card-desc">도시를 산책하는<br/>또 다른 존재를 그린다</div>
        </div>
        <div class="program-card-arrow">→</div>
      </a>

      <a class="program-card" href="walk.html">
        <div class="program-card-icon">
          <img src="icons/발자국(새).png" alt="" />
        </div>
        <div class="program-card-body">
          <div class="program-card-num">프로그램 ③</div>
          <div class="program-card-name">산책 기록</div>
          <div class="program-card-desc">GPS로 걸어온 길과<br/>메모를 지도에 남긴다</div>
        </div>
        <div class="program-card-arrow">→</div>
      </a>

      <a class="program-card" href="games.html">
        <div class="program-card-icon">
          <img src="icons/꼬깔콘.png" alt="" />
        </div>
        <div class="program-card-body">
          <div class="program-card-num">프로그램 ④</div>
          <div class="program-card-name">만든 게임들</div>
          <div class="program-card-desc">이태원에서 만든<br/>작은 웹 게임 모음</div>
        </div>
        <div class="program-card-arrow">→</div>
      </a>

      <a class="program-card" href="parkour.html">
        <div class="program-card-icon">
          <img src="icons/발자국(강).png" alt="" />
        </div>
        <div class="program-card-body">
          <div class="program-card-num">프로그램 ⑤</div>
          <div class="program-card-name">옥상 파쿠르</div>
          <div class="program-card-desc">폰을 기울여 달리고<br/>건물 사이를 뛰어넘는다</div>
        </div>
        <div class="program-card-arrow">→</div>
      </a>
    </div>

    <footer class="launcher-footer">
      <p>이태원 골목 · 수상한 산책클럽</p>
      <p style="margin-top:14px;">
        <a href="about.html" style="color:#14224F;font-weight:800;text-decoration:none;
           border:2px solid #14224F;border-radius:999px;padding:9px 20px;display:inline-block;">
          작가 소개 — 이광현 · 파프리 스튜디오 →</a>
      </p>
      <p style="margin-top:12px;font-size:12px;color:#6B6750;">
        사운드 저니(실시간 진행)는 진행자가 서버를 켠 세션에서만 열립니다.
      </p>
    </footer>
  </main>
</body>
</html>
